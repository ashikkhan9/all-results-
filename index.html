<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ওয়েব ভিত্তিক ফলাফল প্রকাশ সিস্টেম</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    font-family: 'Hind Siliguri', sans-serif;
    /* Liquid background */
    background: linear-gradient(45deg, #0b1f4d, #1e4fd8, #22d3ee, #0b1f4d);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .container {
    width: 100%;
    max-width: 950px;
    /* Liquid Glass effect */
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    border-radius: 12px;
    overflow: hidden;
  }

  .header {
    /* Glassy Green Header */
    background: rgba(15, 157, 88, 0.5);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    padding: 20px;
    display: flex;
    align-items: center;
    color: white;
    text-align: center;
  }

  .header .logo {
    width: 70px;
    height: 70px;
    /* বাংলাদেশ সরকারের অফিশিয়াল লোগো */
    background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/8/84/Government_Seal_of_Bangladesh.svg/1200px-Government_Seal_of_Bangladesh.svg.png') no-repeat center center;
    background-size: contain;
    border-radius: 50%;
    flex-shrink: 0;
    margin-right: 20px;
  }

  .header-text {
    flex-grow: 1;
  }

  .header-text h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  .header-text h2 {
    margin: 8px 0 0;
    font-size: 15px;
    font-weight: 400;
  }

  .form-body {
    padding: 40px;
    background: rgba(255, 255, 255, 0.05);
  }

  .instruction {
    font-size: 15px;
    color: #ffffff;
    margin-bottom: 30px;
    font-weight: 500;
  }

  .form-group {
    display: flex;
    align-items: center;
    margin-bottom: 25px;
    background: rgba(255, 255, 255, 0.05);
    padding: 15px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .form-group label {
    width: 35%;
    font-size: 16px;
    font-weight: 600;
    color: #ffffff;
  }

  .form-group .red-text {
    color: #ff6b6b;
  }

  .form-group select {
    width: 65%;
    padding: 12px 15px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    background: rgba(255, 255, 255, 0.2);
    color: #ffffff;
    font-size: 15px;
    font-family: 'Hind Siliguri', sans-serif;
    outline: none;
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .form-group select option {
    background: #0b1f4d;
    color: #ffffff;
  }

  .form-group select:focus {
    border-color: #22d3ee;
    background: rgba(255, 255, 255, 0.3);
    box-shadow: 0 0 10px rgba(34, 211, 238, 0.3);
  }

  .footer {
    background: rgba(0, 0, 0, 0.25);
    padding: 20px;
    text-align: center;
    color: rgba(255, 255, 255, 0.8);
    font-size: 13px;
    line-height: 1.8;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
  }
  
  .footer i {
    font-style: italic;
  }

  @media (max-width: 768px) {
    .form-group {
      flex-direction: column;
      align-items: flex-start;
      background: transparent;
      padding: 0;
      border: none;
    }
    .form-group label, .form-group select {
      width: 100%;
    }
    .form-group label {
      margin-bottom: 10px;
    }
    .header {
      flex-direction: column;
    }
    .header .logo {
      margin-right: 0;
      margin-bottom: 15px;
    }
    .header-text h1 {
      font-size: 18px;
    }
    .header-text h2 {
      font-size: 13px;
    }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo"></div>
    <div class="header-text">
      <h1>শিক্ষা বোর্ডের ওয়েব ভিত্তিক ফলাফল প্রকাশ সিস্টেম</h1>
      <h2>জেএসসি/জেডিসি/এসএসসি/দাখিল/এইচএসসি/আলিম এবং সমমান পরীক্ষা</h2>
    </div>
  </div>

  <div class="form-body">
    <div class="instruction">
      ফলাফল দেখতে অনুগ্রহ করে নিচের তথ্যগুলো প্রদান করুন
    </div>

    <div class="form-group">
      <label>বোর্ডের নাম</label>
      <select>
        <option>নির্বাচন করুন</option>
        <option>ঢাকা</option>
        <option>রাজশাহী</option>
        <option>কুমিল্লা</option>
        <option>যশোর</option>
        <option>চট্টগ্রাম</option>
        <option>বরিশাল</option>
        <option>সিলেট</option>
        <option>দিনাজপুর</option>
        <option>ময়মনসিংহ</option>
        <option>মাদ্রাসা</option>
        <option>কারিগরি</option>
      </select>
    </div>

    <div class="form-group">
      <label>পরীক্ষার নাম</label>
      <select>
        <option>নির্বাচন করুন</option>
        <option>এইচএসসি/আলিম/সমমান</option>
        <option>এসএসসি/দাখিল/সমমান</option>
        <option>জেএসসি/জেডিসি</option>
      </select>
    </div>

    <div class="form-group">
      <label>পরীক্ষার বছর</label>
      <select>
        <option>নির্বাচন করুন</option>
        <option>২০২৪</option>
        <option>২০২৩</option>
        <option>২০২২</option>
        <option>২০২১</option>
      </select>
    </div>

    <div class="form-group">
      <label class="red-text">ফলাফলের ধরন</label>
      <select>
        <option>নির্বাচন করুন</option>
        <option>ব্যক্তিগত ফলাফল</option>
        <option>প্রতিষ্ঠানভিত্তিক ফলাফল</option>
      </select>
    </div>
  </div>

  <div class="footer">
    কারিগরি সহায়তায়: <i>আন্তঃশিক্ষা বোর্ড সমন্বয় কমিটি</i><br>
    ফলাফল রক্ষণাবেক্ষণ এবং আপডেট: <i>সংশ্লিষ্ট বোর্ড</i><br>
    © সর্বস্বত্ব সংরক্ষিত
  </div>
</div>

</body>
</html>
