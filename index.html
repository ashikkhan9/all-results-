<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>রেজাল্ট বন্ধু — পরীক্ষার ফলাফল দেখুন</title>
<meta name="description" content="HSC, SSC, JSC ফলাফল দেখার সহজ নির্দেশিকা।">
<meta property="og:title" content="রেজাল্ট বন্ধু — পরীক্ষার ফলাফল দেখুন">
<meta name="theme-color" content="#1e3a8a">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* তোমার আগের সব সিএসএস (CSS) ঠিক রাখা হয়েছে, শুধুFetched HTML এর জন্য একটু স্টাইল যোগ করা হলো */
:root{ --navy:#0b1f4d; --royal:#1e4fd8; --royal-2:#3b6cf0; --cyan:#22d3ee; --bg:#eef3fb; --text:#0f1b33; --muted:#52627f; --white:#ffffff; --glass:rgba(255,255,255,.62); --glass-border:rgba(255,255,255,.75); --shadow:0 18px 40px -18px rgba(11,31,77,.28); --err:#c2410c; --ok:#047857; --warn:#b45309; --r-lg:24px; --r-md:16px; --r-sm:12px; --font:'Hind Siliguri',system-ui,sans-serif; }
[data-theme="dark"]{ --bg:#060f26; --text:#e8eefc; --muted:#9fb0cf; --white:#0c1a3a; --glass:rgba(18,34,70,.6); --glass-border:rgba(148,190,255,.18); --shadow:0 18px 40px -18px rgba(0,0,0,.6); }
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);color:var(--text);background:var(--bg);line-height:1.7;min-height:100vh; background-image:radial-gradient(900px 500px at 10% -10%,rgba(59,108,240,.22),transparent 60%),radial-gradient(700px 500px at 110% 10%,rgba(34,211,238,.14),transparent 60%);background-attachment:fixed;}
.container{width:min(1120px,100% - 32px);margin-inline:auto}
.glass{background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--glass-border);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:var(--r-md);font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--royal),var(--navy));color:#fff;border:none;}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-ghost{background:var(--glass);color:var(--text);border:1px solid var(--glass-border);box-shadow:none}
.btn .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;display:none}
.btn.loading .spinner{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.header{padding:12px 0;position:sticky;top:0;z-index:50;}
.hero{padding:40px 0;}
.hero h1{font-size:clamp(1.9rem,4.2vw,3rem);font-weight:700;}
.hero h1 span{background:linear-gradient(120deg,var(--royal),var(--cyan));-webkit-background-clip:text;color:transparent}
section{padding:28px 0}
.form-card{padding:clamp(20px,4vw,36px)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600}
.field input,.field select{min-height:50px;padding:12px 14px;border-radius:var(--r-sm);border:1px solid rgba(59,108,240,.22);background:rgba(255,255,255,.7);width:100%;}
[data-theme="dark"] .field input,[data-theme="dark"] .field select{background:rgba(6,15,38,.6)}
.form-actions{display:flex;gap:12px;margin-top:24px;}
#result-area:empty{display:none}
.result{margin-top:26px;padding:clamp(20px,4vw,34px)}
.banner{padding:12px 14px;border-radius:var(--r-sm);margin-bottom:18px;font-weight:500}
.banner.live{background:rgba(4,120,87,.12);color:var(--ok);border:1px solid rgba(4,120,87,.3)}
.banner.error{background:rgba(194,65,12,.1);color:var(--err);border:1px solid rgba(194,65,12,.3)}
.banner.warn{background:rgba(180,83,9,.12);color:var(--warn);border:1px solid rgba(180,83,9,.3)}

/* নতুন যোগ করা স্টাইল: সরকারি সাইটের টেবিল ঠিক করার জন্য */
.fetched-content table { width: 100%; border-collapse: collapse; margin-top: 15px; }
.fetched-content th, .fetched-content td { padding: 10px; border: 1px solid var(--glass-border); text-align: left; }
.fetched-content th { background: rgba(59,108,240,.1); }
iframe { width: 100%; height: 600px; border: none; border-radius: 12px; background: #fff; }
</style>
</head>
<body>

<header class="header">
  <div class="container">
    <h2 style="font-weight:700; color:var(--text);">🎓 রেজাল্ট বন্ধু</h2>
  </div>
</header>

<main class="container">
  <section class="hero">
    <h1>আপনার ফলাফল দেখুন <span>সহজেই</span></h1>
    <p>সার্ভার ডাউন? কোনো সমস্যা নেই! আমাদের বিকল্প সিস্টেমে চেষ্টা করুন।</p>
  </section>

  <section id="form-section">
    <div class="glass form-card" id="result-form">
      <!-- নোটিশ এরিয়া (রিমোট কনফিগ থেকে আসবে) -->
      <div id="dynamic-alert" style="display:none; margin-bottom:15px;" class="banner warn"></div>

      <form id="resultForm">
        <div class="form-grid">
          <div class="field">
            <label for="exam">পরীক্ষার নাম</label>
            <select id="exam" required>
              <option value="hsc">HSC/Alim/Equivalent</option>
              <option value="ssc">SSC/Dakhil/Equivalent</option>
            </select>
          </div>
          <div class="field">
            <label for="year">বছর</label>
            <select id="year" required>
              <option value="2026">2026</option>
              <option value="2025">2025</option>
              <option value="2024" selected>2024</option>
            </select>
          </div>
          <div class="field">
            <label for="board">বোর্ড</label>
            <select id="board" required>
              <option value="dhaka">Dhaka</option>
              <option value="rajshahi">Rajshahi</option>
              <option value="comilla">Comilla</option>
              <option value="jessore">Jessore</option>
              <option value="chittagong">Chittagong</option>
              <option value="barisal">Barisal</option>
              <option value="sylhet">Sylhet</option>
              <option value="dinajpur">Dinajpur</option>
              <option value="mymensingh">Mymensingh</option>
              <option value="madrasah">Madrasah</option>
              <option value="tec">Technical</option>
            </select>
          </div>
          <div class="field">
            <label for="roll">রোল নম্বর</label>
            <input id="roll" type="number" placeholder="যেমন: 123456" required>
          </div>
          <div class="field">
            <label for="reg">রেজিস্ট্রেশন নম্বর</label>
            <input id="reg" type="number" placeholder="যেমন: 1234567890">
          </div>
        </div>
        <div class="form-actions">
          <button class="btn" type="submit" id="submitBtn">
            <span class="spinner"></span>
            <span class="label">ফলাফল খুঁজুন</span>
          </button>
        </div>
      </form>
    </div>

    <div class="glass result" id="result-area"></div>
  </section>
</main>

<script>
(function () {
  "use strict";

  // ==========================================
  // ১. রিমোট কনফিগারেশন সেটআপ (তোমার কন্ট্রোল প্যানেল)
  // ==========================================
  
  // এই JSON ফাইলটি তুমি GitHub Gist বা Firebase এ হোস্ট করে লিংকটা এখানে বসাবে।
  // ফাইল আপডেট করলেই রিয়েল-টাইমে ওয়েবসাইটের লজিক চেঞ্জ হয়ে যাবে।
  const REMOTE_CONFIG_URL = "https://raw.githubusercontent.com/ashikkhan9/your-repo/main/config.json"; // <-- এখানে তোমার JSON লিংক বসাবে

  // ডিফল্ট কনফিগারেশন (যদি Remote ফাইল লোড না হয়)
  let APP_CONFIG = {
    mode: "api", // 'api' অথবা 'iframe'
    target_url: "http://www.educationboardresults.gov.bd/result.php", 
    proxy_url: "https://my-proxy.workers.dev/?url=", // <-- এখানে তোমার Cloudflare Worker লিংক দিবে
    selector: "table", // সরকারি সাইটের যে টেবিলটা কাটতে চাও তার CSS Class/ID
    alert_message: "" // ইমার্জেন্সি নোটিশ
  };

  // পেজ লোড হলেই কনফিগ ফেচ করবে
  async function loadRemoteConfig() {
    try {
      const res = await fetch(REMOTE_CONFIG_URL + "?v=" + new Date().getTime()); // Cache busting
      if (res.ok) {
        const data = await res.json();
        APP_CONFIG = { ...APP_CONFIG, ...data };
        
        // যদি কনফিগে কোনো ইমার্জেন্সি এলার্ট থাকে
        if (APP_CONFIG.alert_message) {
            const alertBox = document.getElementById("dynamic-alert");
            alertBox.textContent = APP_CONFIG.alert_message;
            alertBox.style.display = "block";
        }
      }
    } catch(e) { console.log("Using Default Config"); }
  }
  loadRemoteConfig();


  // ==========================================
  // ২. কোর লজিক ও ডেটা ফেচিং
  // ==========================================
  const form = document.getElementById("resultForm");
  const submitBtn = document.getElementById("submitBtn");
  const resultArea = document.getElementById("result-area");

  function setLoading(on) {
    submitBtn.classList.toggle("loading", on);
    submitBtn.disabled = on;
    submitBtn.querySelector(".label").textContent = on ? "সার্ভারে খোঁজা হচ্ছে..." : "ফলাফল খুঁজুন";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    
    const data = {
      exam: document.getElementById("exam").value,
      year: document.getElementById("year").value,
      board: document.getElementById("board").value,
      roll: document.getElementById("roll").value,
      reg: document.getElementById("reg").value
    };

    setLoading(true);
    resultArea.innerHTML = "";
    resultArea.style.display = "block";

    // --- ইমার্জেন্সি Iframe ফলব্যাক ---
    if (APP_CONFIG.mode === "iframe") {
       resultArea.innerHTML = `
         <div class="banner warn">সার্ভারে অতিরিক্ত চাপের কারণে সরকারি পোর্টালটি সরাসরি নিচে লোড করা হলো। এখানে ফর্ম পূরণ করুন।</div>
         <iframe src="${APP_CONFIG.target_url}"></iframe>
       `;
       setLoading(false);
       return;
    }

    // --- API / Cloudflare Proxy মেথড ---
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 12000); // ১২ সেকেন্ড পর টাইমআউট

    try {
      // সরকারি সাইটের মেথড অনুযায়ী POST ডেটা রেডি করা (eboardresults এর প্যারামিটার অনুযায়ী)
      const formData = new URLSearchParams();
      formData.append('exam', data.exam);
      formData.append('year', data.year);
      formData.append('board', data.board);
      formData.append('roll', data.roll);
      formData.append('reg', data.reg);

      const fetchUrl = APP_CONFIG.proxy_url + encodeURIComponent(APP_CONFIG.target_url);

      const res = await fetch(fetchUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData.toString(),
        signal: controller.signal
      });

      if (!res.ok) throw new Error("ServerError");
      
      const htmlText = await res.text();
      
      // HTML পার্স করে শুধু রেজাল্ট টেবিলটা কাটা
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlText, 'text/html');
      const resultTable = doc.querySelector(APP_CONFIG.selector);

      if (!resultTable) throw new Error("NoData");

      resultArea.innerHTML = `
        <div class="banner live">✅ ফলাফল সফলভাবে আনা হয়েছে!</div>
        <div class="fetched-content">${resultTable.outerHTML}</div>
        <button onclick="window.print()" class="btn" style="margin-top:20px;">প্রিন্ট করুন</button>
      `;

    } catch (err) {
      // ৩. সার্ভার ডেড হলে মার্কেটিং ট্রিক (ইউজারকে ওয়েট করানো)
      if (err.name === "AbortError" || err.message === "ServerError") {
        resultArea.innerHTML = `<div class="banner error">⚠️ <b>সরকারি সার্ভার সাময়িকভাবে ডাউন আছে!</b> লাখ লাখ মানুষ একসাথে ট্রাই করায় সার্ভার ক্র্যাশ করেছে। অনুগ্রহ করে ৩-৪ মিনিট পর আবার <b>'ফলাফল খুঁজুন'</b> বাটনে ক্লিক করুন।</div>`;
      } else {
        resultArea.innerHTML = `<div class="banner error">❌ রোল বা রেজিস্ট্রেশন ভুল আছে অথবা সরকারি সার্ভার ক্যাপচা বসিয়েছে। আবার চেষ্টা করুন।</div>`;
      }
    } finally {
      clearTimeout(timer);
      setLoading(false);
    }
  });

})();
</script>
</body>
</html>
